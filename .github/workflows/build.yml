name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  android:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Create platform shells
        run: tool/bootstrap.sh

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK for release
        run: |
          version="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/app/outputs/flutter-apk/Mojac-${version}-arm64-v8a.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/Mojac-*-arm64-v8a.apk

  linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev \
            rpm

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - name: Create platform shells
        run: tool/bootstrap.sh

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package DEB, RPM and AppImage
        run: |
          tool/package_linux.sh \
            --bundle build/linux/x64/release/bundle \
            --arch amd64 \
            --formats deb,rpm,appimage

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/Mojac-*.AppImage

  linux-arm64:
    name: Linux arm64
    # The arm64 GitHub-hosted runner is free for public repositories only.
    # Private repositories skip this job instead of failing every build.
    if: github.event.repository.private != true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libmpv-dev \
            rpm

      - name: Set up Flutter (source bootstrap)
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Create platform shells
        run: tool/bootstrap.sh

      - name: Build Linux bundle
        run: flutter build linux --release

      - name: Package DEB, RPM and AppImage
        run: |
          tool/package_linux.sh \
            --bundle build/linux/arm64/release/bundle \
            --arch arm64 \
            --formats deb,rpm,appimage

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/Mojac-*.AppImage

  release:
    name: Publish release
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.quality.result == 'success' && needs.android.result == 'success' && needs.linux-amd64.result == 'success' && (needs.linux-arm64.result == 'success' || needs.linux-arm64.result == 'skipped')
    needs: [quality, android, linux-amd64, linux-arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Write checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | sort | xargs -r sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
