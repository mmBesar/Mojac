<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Mojac">
  <defs>
    <linearGradient id="bg" x1="88" y1="56" x2="944" y2="968" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.42" stop-color="#7c3aed"/>
      <stop offset="0.74" stop-color="#db2777"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.12" r="0.66" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.92" r="0.58" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="232" y1="260" x2="792" y2="740" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f0fdff"/>
      <stop offset="1" stop-color="#bdf3ff"/>
    </linearGradient>
    <linearGradient id="play" x1="700" y1="640" x2="838" y2="846" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffbeb"/>
      <stop offset="1" stop-color="#fbcfe8"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#1e1b4b" flood-opacity="0.36"/>
    </filter>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#f9a8d4" flood-opacity="0.75"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="236" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="236" fill="url(#glowA)"/>
  <rect width="1024" height="1024" rx="236" fill="url(#glowB)"/>

  <!-- A light sweep keeps the flat gradient feeling energetic. -->
  <path d="M-60 892L1104 372" stroke="#ffffff" stroke-opacity="0.09" stroke-width="132"/>

  <!-- Waves, echoing the "your waves" meaning of Mojac. -->
  <g fill="none" stroke-linecap="round">
    <path d="M150 860c120-66 240-66 360 0s240 66 360 0" stroke="#67e8f9" stroke-width="30" opacity="0.58"/>
    <path d="M150 936c120-66 240-66 360 0s240 66 360 0" stroke="#a5f3fc" stroke-width="22" opacity="0.3"/>
  </g>

  <!-- The M is drawn as two soft wave crests. -->
  <path d="M232 716V430c0-100 112-126 182-34l108 142 108-142c70-92 182-66 182 34v286"
        fill="none" stroke="url(#mark)" stroke-width="110"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>

  <!-- Live broadcast rings around the play badge. -->
  <circle cx="742" cy="744" r="192" fill="none" stroke="#a5f3fc" stroke-opacity="0.32" stroke-width="14"/>
  <circle cx="742" cy="744" r="162" fill="none" stroke="#f9a8d4" stroke-opacity="0.62" stroke-width="8"/>

  <!-- Play badge tucked onto the right leg of the M. -->
  <circle cx="742" cy="744" r="146" fill="#111827" filter="url(#soft)"/>
  <path d="M702 668c0-15 16-24 29-17l98 60c13 8 13 26 0 34l-98 60c-13 7-29-2-29-17V668z"
        fill="url(#play)" filter="url(#neon)"/>
</svg>
